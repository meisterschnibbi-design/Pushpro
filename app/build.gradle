// app/build.gradle  (Groovy DSL)

// WICHTIG: Im Projekt-Root müssen die Plugin-Versionen stehen:
// build.gradle (Root):
// plugins {
//     id 'com.android.application' version '8.5.2' apply false
//     id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
// }

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pushpro'
    compileSdk 34

    defaultConfig {
        // Lass applicationId so, wie sie bei euch gilt. Falls leer, notfalls:
        // applicationId "com.pushpro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    // füge hier eure weiteren Abhängigkeiten wieder ein, falls nötig
}
