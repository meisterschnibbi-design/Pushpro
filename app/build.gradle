// app/build.gradle (Groovy DSL)

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pushpro'
    compileSdk 34

    defaultConfig {
        // applicationId belassen, falls bei euch bereits gesetzt.
        // applicationId "com.pushpro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // >>> Feste Signatur für Updates (liest Passwörter/Alias aus ENV/Secrets)
    signingConfigs {
        release {
            // Keystore wird in CI per Workflow nach app/pushpro-release.jks geschrieben
            storeFile file("pushpro-release.jks")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias      System.getenv("ANDROID_KEY_ALIAS")
            keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            // mit dem festen Keystore signieren
            signingConfig signingConfigs.release

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Debug kann den Android-Standard-debug.keystore nutzen
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    // weitere Abhängigkeiten hier
}
