name: Android CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # (Optional) Gradle Cache für schnellere Builds
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Versuch 1: Offizielle Action
      - name: Setup Android SDK (try 1)
        id: sdk1
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
        continue-on-error: true

      # Versuch 2 (flaky Fix)
      - name: Setup Android SDK (try 2)
        if: steps.sdk1.outcome == 'failure'
        id: sdk2
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
        continue-on-error: true

      # Fallback: manuell
      - name: Setup Android SDK (manual fallback)
        if: steps.sdk1.outcome == 'failure' && steps.sdk2.outcome == 'failure'
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q -o cmdtools.zip
          mv cmdline-tools latest || true
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # === Keystore aus Secrets wiederherstellen (für signierte Release-Builds) ===
      - name: Restore keystore from secrets
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/pushpro-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Build Debug APK (unsigniert/Debug-Key – zum schnellen Testen)
      - name: Assemble Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Build Release APK & AAB (signiert mit Keystore aus build.gradle)
      - name: Assemble Release (APK) & Bundle Release (AAB)
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Artefakte hochladen
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
